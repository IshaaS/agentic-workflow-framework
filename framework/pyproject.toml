[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentctl-core"
dynamic = ["version"]
description = "Generic SDK, runtime and CLI for the Agentic Workflow Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
# Optional: natural-language requests (agentctl run workflow --request).
llm = ["anthropic>=1,<2"]

[project.scripts]
agentctl = "agentctl_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "agentctl_core.__version__" }
