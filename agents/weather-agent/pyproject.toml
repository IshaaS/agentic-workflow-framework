[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentctl-weather-agent"
version = "0.1.0"
description = "Weather agent plugin for agentctl"
requires-python = ">=3.10"
dependencies = ["agentctl-core>=0.1.0"]

[project.entry-points."agentctl.agents"]
weather = "agentctl_agents.weather.agent:WeatherAgent"

# agentctl_agents/ is a PEP 420 namespace shared with other distributions; it has no __init__.py.
[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
